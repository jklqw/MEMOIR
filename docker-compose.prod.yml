name: memoir-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: memoir-prod-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memoir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-memoir_prod}
    networks:
      - internal-net
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-memoir} -d ${POSTGRES_DB:-memoir_prod}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: memoir-prod-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}']
    networks:
      - internal-net
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: memoir-prod-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-memoir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memoir_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in production}
      SERVER_KMS_KEY: ${SERVER_KMS_KEY:?SERVER_KMS_KEY is required in production}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required in production}
      WEB_URL: ${WEB_URL:-https://memoir.local}
      STORAGE_DIR: /app/storage/uploads
      RP_ID: ${RP_ID:-memoir.local}
      RP_NAME: ${RP_NAME:-Memoir}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@memoir.local}
    networks:
      - internal-net
      - frontend-net
    expose:
      - '4000'
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: memoir-prod-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    networks:
      - frontend-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  frontend-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true # Hard isolation: Zero external egress, zero public port exposure

volumes:
  postgres_data:
  redis_data:
  uploads_data:
