name: Security CI & Automated Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks & Custom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Memoir Local Secret Scanner
        run: node scripts/scan-secrets.mjs

  security-checks:
    name: Security Lint, Dependency Audit & Regression Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir_ci_password
          POSTGRES_DB: memoir_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Static Analysis & Lint
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://memoir:memoir_ci_password@localhost:5432/memoir_ci
        run: pnpm --filter @memoir/api exec prisma migrate deploy

      - name: Automated Security Regression Suite
        env:
          DATABASE_URL: postgresql://memoir:memoir_ci_password@localhost:5432/memoir_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-temporary-jwt-secret-testing-minimum-32-chars
          SERVER_KMS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          STORAGE_DIR: ./storage/ci-uploads
          PORT: 3001
          HOST: 0.0.0.0
          NODE_ENV: test
          WEB_URL: http://localhost:5173
        run: pnpm test:security

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
