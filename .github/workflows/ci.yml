name: Memoir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Style Check (Prettier)
        run: pnpm format:check

      - name: Static Code Analysis (ESLint)
        run: pnpm lint

      - name: Strict Typecheck (TypeScript)
        run: pnpm typecheck

  crypto-and-frontend:
    name: Cryptography Invariants & Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Cryptographic Invariant Tests
        run: pnpm --filter @memoir/crypto test

      - name: Run Web Unit, Offline Sync & Insights Tests
        run: pnpm --filter @memoir/web test

      - name: Verify Web Production Bundle Build
        run: pnpm --filter @memoir/web build

  backend-integration:
    name: Backend Integration & Security Regression Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir_ci_password
          POSTGRES_DB: memoir_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://memoir:memoir_ci_password@localhost:5432/memoir_ci
        run: pnpm --filter @memoir/api exec prisma migrate deploy

      - name: Run API Integration Tests
        env:
          DATABASE_URL: postgresql://memoir:memoir_ci_password@localhost:5432/memoir_ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SESSION_SECRET: ci-temporary-session-secret-min-32-chars-ok
          SERVER_KMS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CSRF_SECRET: ci-temporary-csrf-secret-minimum-32-chars-long
          STORAGE_DIR: ./storage/ci-uploads
          PORT: 3001
          HOST: 0.0.0.0
          NODE_ENV: test
          WEB_URL: http://localhost:5173
        run: pnpm --filter @memoir/api test

      - name: Run Security Regression Suite
        env:
          DATABASE_URL: postgresql://memoir:memoir_ci_password@localhost:5432/memoir_ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SESSION_SECRET: ci-temporary-session-secret-min-32-chars-ok
          SERVER_KMS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CSRF_SECRET: ci-temporary-csrf-secret-minimum-32-chars-long
          STORAGE_DIR: ./storage/ci-uploads
          PORT: 3001
          HOST: 0.0.0.0
          NODE_ENV: test
          WEB_URL: http://localhost:5173
        run: pnpm test:security

  security-scan:
    name: Secret Scanning & Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Memoir Local Secret Scanner
        run: node scripts/scan-secrets.mjs

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
